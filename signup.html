<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ReviewFlow | TrioVibe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="reviewflow-page">
    <div class="rf-auth-container">
        <div class="rf-auth-card">
            <div class="rf-auth-header">
                <a href="reviewflow.html" class="rf-auth-logo">ReviewFlow</a>
                <p style="color: var(--text-secondary);">Start your 14-day free trial. No credit card required.</p>
            </div>

            <form action="#" method="POST">
                <label for="name" class="rf-label">Full Name</label>
                <input type="text" id="name" name="name" class="rf-input" placeholder="John Doe" required>

                <label for="email" class="rf-label">Email</label>
                <input type="email" id="email" name="email" class="rf-input" placeholder="Enter your email" required>

                <label for="password" class="rf-label">Password</label>
                <input type="password" id="password" name="password" class="rf-input" placeholder="Create a password"
                    required>
                <p style="font-size: 0.75rem; color: var(--text-light); margin-top: -0.5rem; margin-bottom: 1.5rem;">
                    Must be at least 8 characters.</p>

                <button type="submit" class="btn btn-primary rf-btn-primary" style="width: 100%;">Create
                    Account</button>
            </form>

            <div class="rf-divider">
                <span>OR</span>
            </div>

            <button class="btn btn-secondary"
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Sign up with Google
            </button>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                Already have an account? <a href="signin.html"
                    style="color: var(--rf-primary); text-decoration: none; font-weight: 600;">Sign in</a>
            </p>
        </div>
    </div>
</body>

</html>
